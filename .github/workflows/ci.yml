name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc

  loom:
    name: loom (concurrency model checking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Explore every interleaving of the snapshot cell
        # Loom re-runs each test under every thread interleaving its model
        # permits, so a race that a stress test would hit once in a million runs
        # fails here deterministically.
        run: "cargo test -p farol-core --lib --release -- snapshot::"
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Check the unsafe code for UB
        # Covers the raw reference-count manipulation in the snapshot cell and
        # the byte-level decoding in the codec and the index.
        run: "cargo miri test -p farol-core --lib -- snapshot:: codec:: index::"
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance
